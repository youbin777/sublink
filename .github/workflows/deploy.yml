name: Sublink stable auto-upgrade

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/auto-upgrade.mjs'
      - 'scripts/auto-upgrade.test.mjs'

permissions:
  contents: read

concurrency:
  group: sublink-production-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify upgrade safeguards
        run: node --test automation/scripts/auto-upgrade.test.mjs
      - name: Verify production deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node automation/scripts/auto-upgrade.mjs preflight
      - name: Detect latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/auto-upgrade.mjs detect
      - name: Checkout immutable upstream release
        if: steps.release.outputs.upgrade == 'true'
        uses: actions/checkout@v4
        with:
          repository: 7Sageer/sublink-worker
          ref: ${{ steps.release.outputs.sha }}
          path: upstream
          persist-credentials: false
      - name: Preserve production Worker and KV
        if: steps.release.outputs.upgrade == 'true'
        run: node automation/scripts/auto-upgrade.mjs prepare upstream
      - name: Install locked upstream dependencies
        if: steps.release.outputs.upgrade == 'true'
        working-directory: upstream
        run: npm ci --no-audit --no-fund
      - name: Run official release tests
        if: steps.release.outputs.upgrade == 'true'
        working-directory: upstream
        run: npm test
      - name: Install deployment tooling
        if: steps.release.outputs.upgrade == 'true'
        run: npm install --prefix tooling --no-audit --no-fund wrangler@4.51.0
      - name: Upload, activate, verify, and rollback on failure
        if: steps.release.outputs.upgrade == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '80a521ba84f9998155fd875767e1e947'
          WRANGLER_SEND_METRICS: 'false'
        run: node automation/scripts/auto-upgrade.mjs apply upstream
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sublink-upgrade-${{ github.run_id }}
          path: |
            upgrade-state.json
            deployment-before.json
            candidate-version.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Summarize
        if: always()
        env:
          RELEASE: ${{ steps.release.outputs.tag }}
          UPGRADE: ${{ steps.release.outputs.upgrade }}
          RESULT: ${{ job.status }}
        run: |
          printf 'Release: %s\nUpgrade needed: %s\nResult: %s\n' "$RELEASE" "$UPGRADE" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
